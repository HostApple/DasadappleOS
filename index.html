<body>

  <div class="boot-content"><div class="boot-mark" aria-hidden="true">✦</div><div class="boot-name" id="boot-name">✦  DasadappleOS  ✦</div><div class="hello">yO wassup.</div></div>
</div>
<div id="desktop">
  <header class="menustrip">
    <div class="strip-left">
      <span class="logo">Dasadapple<span style="color:var(--accent)">OS</span></span>
      <span id="active-app">WebOS</span><span class="hide-small" id="headupdate">
      </span>
    </div>
    <div class="strip-right"><span id="headclock"></span>
      <button id="gearbtn" aria-label="Open settings">☷</button>
    </div>
  </header>
  <aside class="deskclock" aria-label="Desktop clock"><div class="dayline" id="headweekday">WEDNESDAY</div><div class="bigtime" id="widget-time">01<span>:</span>12</div><div class="dateline" id="headmonthday">OCTOBER 21</div></aside>
  <div id="window-layer"></div>
  <nav class="dock" aria-label="Application dock">
    <button class="slot" data-app="Finder">
      <span class="mark">▦</span>
      <span class="label">Files</span>
      <span class="running"></span>
    </button>
    <button class="slot" data-app="Browser">
      <span class="mark">↗</span>
      <span class="label">Browser</span>
      <span class="running"></span>
    </button>
    <button class="slot" data-app="Maps">
      <span class="mark">⌖</span>
      <span class="label">Maps</span>
      <span class="running"></span>
    </button>
    <button class="slot" data-app="Notes">
      <span class="mark">✎</span>
      <span class="label">Notes</span>
      <span class="running"></span>
    </button>
    <button class="slot" data-app="Terminal">
      <span class="mark">›_</span>
      <span class="label">Terminal</span>
      <span class="running"></span>
    </button>
    <button class="slot" data-app="Spotify">
      <span class="mark">♫</span>
      <span class="label">Spotify</span>
      <span class="running"></span>
    </button>
    <button class="slot" data-app="About Me">
      <span class="mark">☺</span>
      <span class="label">About Me</span>
      <span class="running"></span>
    </button>
    <span class="vrule"></span>
    <button class="slot" data-app="Settings"><span class="mark">⚙</span><span class="label">Settings</span><span class="running"></span></button>
  </nav>
  <div class="toast" id="toast" role="status"></div><div id="window-context" class="menu-pop" hidden></div><div id="command-layer" hidden></div><input id="wallpaper-upload" type="file" accept="image/*">
</div>







<!--css part frm here-->
<style>
/* colors + the desktop styles */
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Urbanist:wght@400;500;600;700;800&display=swap');

:root{
  --accent:#d65d2f;
  --orange:#d65d2f;
  --orange-pale:#f2c3a3;
}
/* most of the other colors I just typed in where I needed them, the 3 above
   are the only ones the settings panel actually changes */

*{box-sizing:border-box}
body{margin:0;height:100vh;overflow:hidden;color:#252820;background:#e9e4d8;font-family:"Plus Jakarta Sans",Urbanist,sans-serif}
button,input,textarea{font:inherit}
button{cursor:pointer;color:inherit}
button:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

#desktop{position:relative;width:100%;height:100%;overflow:hidden;background:#e9e4d8;background-size:cover;background-position:center}
.menustrip{position:absolute;z-index:1000;inset:0 0 auto;height:35px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:#252820;color:#e9e4d8;border-bottom:1px solid var(--accent);font-size:11px;letter-spacing:.04em}
.logo{font-weight:800;letter-spacing:.12em}
.menustrip .strip-left,.menustrip .strip-right{display:flex;align-items:center;gap:17px}
.strip-left .hide-small{display:none}
#headclock{font-variant-numeric:tabular-nums;font-weight:700}
#headupdate{font-size:11px;color:#c5c4b8}
#gearbtn{background:none;border:0;color:#e9e4d8;font-size:17px}

.deskclock{position:absolute;z-index:2;right:5.5%;top:12%;width:310px;text-align:right;pointer-events:none;color:#252820;font-variant-numeric:tabular-nums}
.deskclock .dayline{font-size:11px;font-weight:800;letter-spacing:.22em;color:#686b5d}
.deskclock .bigtime{margin:8px 0 2px;font-size:clamp(42px,5vw,72px);line-height:1;font-weight:500;letter-spacing:-.075em}
.deskclock .bigtime span{color:var(--accent);animation:blink 2s steps(2,end) infinite}
.deskclock .dateline{font-size:10px;letter-spacing:.2em;color:#686b5d}
@keyframes blink{50%{opacity:.35}}

#window-layer{position:absolute;inset:35px 0 105px;z-index:5;pointer-events:none}
.window{position:absolute;display:flex;flex-direction:column;width:510px;height:355px;min-width:280px;min-height:190px;background:#f5f1e8;border:1px solid #252820;box-shadow:5px 7px 0 rgba(37,40,32,.13);pointer-events:auto;animation:appear .22s cubic-bezier(.2,.8,.2,1);will-change:transform,opacity}
.window.hidden{display:none}
.window.maximized{left:12px!important;top:12px!important;width:calc(100% - 24px)!important;height:calc(100% - 24px)!important}
@keyframes appear{from{opacity:0;transform:translateY(9px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}

.windowhead{height:39px;flex:0 0 39px;display:flex;align-items:center;gap:10px;padding:0 11px;background:#d8d0c1;border-bottom:1px solid #252820;cursor:grab;user-select:none}
.windowhead:active{cursor:grabbing}
.dots{display:flex;gap:5px}
.dots button{width:10px;height:10px;border:1px solid #252820;border-radius:50%;padding:0;background:var(--orange)}
.dots button:nth-child(2){background:#d4b66e}
.dots button:nth-child(3){background:#68775a}
.windowhead .windowname{flex:1;font-size:11px;font-weight:800;letter-spacing:.04em}
.windowhead .stamp{color:#686b5d;font-size:8px;letter-spacing:.15em;font-weight:800}

.pane{flex:1;min-height:0;overflow:auto;padding:17px;font-size:12px}
.pane::-webkit-scrollbar{width:7px}
.pane::-webkit-scrollbar-thumb{background:#d8d0c1}

.pane .hdr{margin:0 0 12px;color:var(--orange);font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase}
.dim{color:#686b5d}
.tiny{font-size:10px}
.pane .spread{display:flex;align-items:center;gap:9px;justify-content:space-between}
.pane .linedup{display:flex;align-items:center;gap:9px}

.btn{padding:8px 11px;background:transparent;border:1px solid #252820;font-size:10px;font-weight:700;transition:background .12s,color .12s}
.btn:hover{background:#252820;color:#e9e4d8}
.btn.gobtn{background:var(--accent);border-color:var(--accent);color:#fff8ed}
.btn.gobtn:hover{background:#252820;border-color:#252820}
.boxtext{width:100%;min-width:0;padding:9px 10px;border:1px solid #bcb6a8;background:#fffdf7;color:#252820}
.pane .notebox{padding:12px;border:1px solid #bcb6a8;background:#fffdf7}

.pane .things{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:8px}
.pane .thing{padding:12px 6px;border:1px solid transparent;text-align:center;cursor:pointer}
.pane .thing:hover{border-color:var(--accent);background:#fffaf0}
.pane .thing .mark{font-size:24px;margin-bottom:7px}
.pane .thing .label{font-size:10px;font-weight:700}

.terminal{display:flex;flex-direction:column;height:100%;background:#242820;color:#e8e5d9;font:12px/1.65 ui-monospace,Consolas,monospace}
.terminal .out{flex:1;overflow:auto;padding:13px;white-space:pre-wrap}
.terminal .out .accent{color:#f3a078}
.terminal .out .good{color:#b6d09e}
.terminal .type{display:flex;align-items:center;gap:8px;padding:10px;border-top:1px solid #56594d}
.terminal .type span{color:#f3a078}
.terminal .type input{flex:1;min-width:0;color:#fff;background:transparent;border:0;outline:0;font:inherit}

.webpane{min-height:205px;padding:20px;background:#fffdf7;border:1px solid #bcb6a8}
.webpane h2{margin:10px 0;font:650 27px/1 Fraunces,serif;letter-spacing:-.04em}
.webpane p{max-width:430px;color:#686b5d;line-height:1.7}
.note-area{width:100%;height:calc(100% - 54px);min-height:150px;resize:none;border:0;outline:0;background:transparent;color:#252820;font:13px/1.8 Urbanist,sans-serif}
.note-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;color:#686b5d;font-size:10px}
.prefline{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0;border-bottom:1px solid #bcb6a8}
.swatch{width:22px;height:22px;border:1px solid #252820;border-radius:50%}
.swatch.picked{outline:2px solid var(--accent);outline-offset:2px}
.spotify-frame{display:block;width:100%;height:352px;border:0;border-radius:12px;background:#ded8cc}
.aboutwrap{display:grid;grid-template-columns:110px 1fr;gap:18px;align-items:start}
.aboutwrap .bigd{min-height:130px;display:grid;place-items:center;background:var(--orange-pale);border:1px solid #252820;font:650 40px Fraunces,serif}

.dock{position:absolute;z-index:1200;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:flex-end;gap:8px;max-width:calc(100vw - 24px);padding:10px 13px;border-radius:17px;background:#252820;border:1px solid #252820;box-shadow:0 12px 34px rgba(37,40,32,.18)}
.dock .slot{min-width:60px;padding:5px 4px 3px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;color:#e9e4d8;transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.dock .slot:hover{transform:translateY(-5px)}
.dock .slot .mark{width:44px;height:43px;border-radius:11px;display:grid;place-items:center;background:#e9e4d8;color:#252820;border-bottom:3px solid var(--accent);font-size:21px}
.dock .slot .label{font-size:10px}
.dock .slot .running{width:4px;height:4px;background:var(--orange-pale);border-radius:50%;opacity:0}
.dock .slot.open .running{opacity:1}
.dock .vrule{height:31px;width:1px;margin:0 4px 10px;background:#6e7066}

.toast{position:absolute;z-index:2000;bottom:90px;left:50%;transform:translate(-50%,8px);padding:10px 14px;background:#252820;color:#e9e4d8;border-left:4px solid var(--accent);font-size:11px;opacity:0;pointer-events:none;transition:.16s}
.toast.show{opacity:1;transform:translate(-50%,0)}
#wallpaper-upload{display:none}

.menu-pop{position:fixed;z-index:3000;min-width:178px;padding:5px;background:#f5f1e8;border:1px solid #252820;box-shadow:3px 4px 0 rgba(37,40,32,.18)}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:transparent;padding:9px 10px;font-size:11px}
.menu-pop button:hover{background:#d8d0c1}
.menu-pop button.nope{color:#a13d26}
.menu-pop .sep{height:1px;background:#bcb6a8;margin:4px 2px}

#command-layer[hidden]{display:none}
.palette-backdrop{position:fixed;inset:0;z-index:2500;background:rgba(37,40,32,.12);display:flex;justify-content:center;align-items:flex-start;padding:48px 0 0}
.command-palette{width:min(540px,calc(100vw - 28px));background:#f5f1e8;border:1px solid #252820;box-shadow:5px 6px 0 rgba(37,40,32,.18)}
.command-palette form{display:flex;gap:10px;padding:14px;border-bottom:1px solid #bcb6a8}
.command-palette input{flex:1;min-width:0;background:transparent;border:0;outline:0;font:13px "Plus Jakarta Sans",sans-serif}
.palette-backdrop .hint{padding:9px 14px;color:#686b5d;font-size:10px}

#boot-screen{position:fixed;inset:0;z-index:99999;display:grid;place-items:center;background:#f3f0e7;color:#242720;opacity:1;visibility:visible;transition:opacity .55s cubic-bezier(.22,1,.36,1),visibility 0s linear 0s}
#boot-screen.is-leaving{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .55s cubic-bezier(.22,1,.36,1),visibility 0s linear .55s}
#boot-screen .boot-content{display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center}
#boot-screen .boot-mark{width:44px;height:44px;border:1.5px solid #292b25;border-radius:50%;display:grid;place-items:center;font:600 18px/1 'Plus Jakarta Sans',sans-serif;letter-spacing:-1px;opacity:0;transform:translateY(7px) scale(.96);animation:boot-in .6s cubic-bezier(.22,1,.36,1) .08s forwards}
#boot-screen .boot-name{font:600 12px/1.4 'Plus Jakarta Sans',sans-serif;letter-spacing:.22em;text-transform:uppercase;opacity:0;transform:translateY(7px);animation:boot-in .6s cubic-bezier(.22,1,.36,1) .22s forwards}
#boot-screen .boot-name.hide{opacity:0;transform:translateY(-5px);animation:none}
#boot-screen .hello{position:absolute;top:50%;left:50%;width:max-content;transform:translate(-50%,calc(-50% + 8px));font:500 clamp(38px,6vw,64px)/1 'Plus Jakarta Sans',sans-serif;letter-spacing:-.065em;opacity:0;visibility:hidden;transition:opacity .48s cubic-bezier(.22,1,.36,1),transform .48s cubic-bezier(.22,1,.36,1),visibility 0s linear .48s}
#boot-screen .hello.show{opacity:1;visibility:visible;transform:translate(-50%,-50%);transition-delay:0s}
#boot-screen.hello-phase .boot-mark{opacity:0;transform:translateY(-5px) scale(.98);transition:opacity .3s ease,transform .3s ease;animation:none}
@keyframes boot-in{to{opacity:1;transform:translateY(0) scale(1)}}

@media(max-width:700px){
  .menustrip{padding:0 10px}
  .menustrip .strip-left,.menustrip .strip-right{gap:9px}
  .strip-left .hide-small{display:inline}
  .deskclock{top:9%;right:14px;width:220px}
  .deskclock .bigtime{font-size:48px}
  .window{left:12px!important;width:calc(100vw - 24px)!important;height:min(510px,calc(100vh - 160px))}
  .dock{gap:0;padding:5px}
  .dock .slot{min-width:39px}
  .dock .slot .mark{width:32px;height:32px;font-size:16px}
  .dock .slot .label{font-size:8px}
  .aboutwrap{grid-template-columns:1fr}
  .aboutwrap .bigd{min-height:72px}
}

}

<script>
// this part makes the apps and windows do stuff
(function () {

  var bootScreen = document.getElementById('boot-screen');
  var bootName = document.getElementById('boot-name');

  };

  function openApp(name) {
    // files and file manager mean the same thing, just easier to type
    if (name === 'Files' || name === 'File Manager') name = 'Finder';
    if (!appDetails[name]) {
      toast('umm app not found');
      return;
    }

    // already open? just bring it back to the front instead of making a new one
    if (windows.has(name)) {
      var existing = windows.get(name);
      existing.classList.remove('hidden');
      zCounter = zCounter + 1;
      existing.style.zIndex = zCounter;
      $('#active-app').textContent = appDetails[name].title;
      syncDock();
      return;
    }

    var win = document.createElement('section');
    win.className = 'window';
    win.dataset.app = name;
    zCounter = zCounter + 1;
    win.style.zIndex = zCounter;

    var n = window_count;
    window_count = window_count + 1;

    // the little offset so they don't all stack exactly on top of each other
    var leftPos = 95 + n * 24;
    if (leftPos > innerWidth - 530) leftPos = innerWidth - 530;
    if (leftPos < 12) leftPos = 12;
    win.style.left = leftPos + 'px';

    var topPos = 82 + n * 22;
    if (topPos > innerHeight - 450) topPos = innerHeight - 450;
    if (topPos < 55) topPos = 55;
    win.style.top = topPos + 'px';

    if (innerWidth < 700) {
      win.style.left = '12px';
      win.style.top = (55 + Math.min(n * 12, 70)) + 'px';
      win.style.width = 'calc(100vw - 24px)';
      win.style.height = 'min(510px, calc(100vh - 160px))';
    }

    win.innerHTML = `<div class="windowhead">
    <div class="dots"><button data-close aria-label="Close"></button>
    <button data-minimize aria-label="Minimize"></button><button data-maximize aria-label="Maximize"></button></div>
    <div class="windowname">${appDetails[name].icon} &nbsp; ${appDetails[name].title}</div><span class="stamp">DASADAPPLEOS</span></div><div class="pane">${views[name]}</div>`;

    windowLayer.appendChild(win);
    windows.set(name, win);
    $('#active-app').textContent = appDetails[name].title;
    syncDock();

    win.addEventListener('pointerdown', function () {
      zCounter = zCounter + 1;
      win.style.zIndex = zCounter;
      $('#active-app').textContent = appDetails[name].title;
    });

    makeDraggable(win);

    win.addEventListener('contextmenu', function (ev) {
      ev.preventDefault();
      showWindowMenu(ev.clientX, ev.clientY, name, win);
    });

    $('[data-close]', win).onclick = function () {
      win.remove();
      windows.delete(name);
      syncDock();
      $('#active-app').textContent = 'Desktop';
    };

    $('[data-minimize]', win).onclick = function () {
      win.classList.add('hidden');
      toast('Minimized - click the dock icon to bring it back.');
    };

    $('[data-maximize]', win).onclick = function () {
      win.classList.toggle('maximized');
    };

    if (name === 'Terminal') setupTerminal(win);
    if (name === 'Notes') setupNotes(win);
    if (name === 'Browser') setupBrowser(win);
    if (name === 'Maps') setupMaps(win);
    if (name === 'Finder') setupFinder(win);
    if (name === 'Settings') setupSettings(win);
  }

  function makeDraggable(win) {
    var bar = $('.windowhead', win);
    var grab = null;

    bar.addEventListener('pointerdown', function (evt) {
      if (evt.target.closest('button')) return;
      if (win.classList.contains('maximized')) return;
      var rect = win.getBoundingClientRect();
      grab = { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
      bar.setPointerCapture(evt.pointerId);
    });

    bar.addEventListener('pointermove', function (evt) {
      if (!grab) return;
      var newX = evt.clientX - grab.x;
      if (newX < 0) newX = 0;
      if (newX > innerWidth - win.offsetWidth) newX = innerWidth - win.offsetWidth;
      win.style.left = newX + 'px';

      var newY = evt.clientY - grab.y;
      if (newY < 43) newY = 43;              // 43 = height of the strip, don't drag under it
      if (newY > innerHeight - 100) newY = innerHeight - 100;
      win.style.top = newY + 'px';
    });

    ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(function (type) {
      bar.addEventListener(type, function () { grab = null; });
    });
  }

  function syncDock() {
    $$('.slot').forEach(function (button) {
      if (windows.has(button.dataset.app)) button.classList.add('open');
      else button.classList.remove('open');
    });
  }

  function setupTerminal(win) {
    var output = $('[data-output]', win);
    var form = $('[data-command-form]', win);
    var input = $('[data-command]', win);

    function say(message, kind) {
      var line = document.createElement('div');
      if (kind) line.className = kind;
      line.textContent = message;
      output.appendChild(line);
      output.scrollTop = output.scrollHeight;
    }

    form.onsubmit = function (e) {
      e.preventDefault();
      var command = input.value.trim();
      if (!command) return;

      say('❯ ' + command);
      input.value = '';

      var bits = command.split(' ');
      var word = bits.shift().toLowerCase();
      var arg = bits.join(' ');

      // this got long but honestly an if/else is easier to add to than a table
      if (word === 'help') {
        say('Commands: help, about, date, clear, echo, apps, open, whoami, fortune');
      } else if (word === 'about') {
        say('DasadappleOS is my little web desktop thing.');
      } else if (word === 'date') {
        say(new Date().toString());
      } else if (word === 'clear') {
        output.replaceChildren();
      } else if (word === 'echo') {
        say(arg);
      } else if (word === 'apps') {
        say('Browser, Maps, File Manager, Notes, Settings, Spotify, Terminal, About Me');
      } else if (word === 'whoami') {
        say('a curious human');
      } else if (word === 'fortune') {
        var pick = Math.floor(Math.random() * thoughts.length);
        say(thoughts[pick]);
      } else if (word === 'open') {
        var wanted = arg.toLowerCase();
        var match = null;
        for (var appName in appDetails) {
          var key = appName.toLowerCase();
          var title = appDetails[appName].title.toLowerCase();
          if (key === wanted || title === wanted) {
            match = appName;
            break;
          }
        }
        if (match) {
          openApp(match);
          say('Opening ' + appDetails[match].title + '...', 'good');
        } else {
          say('cant find that app lol. type apps');
        }
      } else {
        say('no idea what that command is. try help');
      }
    };
    input.focus();
  }

  function setupNotes(win) {
    var note = $('[data-note]', win);
    var status = $('[data-save-status]', win);

    try {
      note.value = localStorage.getItem('dasadapple-note') || '';
    } catch (err) {
      status.textContent = 'Could not load saved no';
    }

    var save_timer = null;
    note.addEventListener('input', function () {
      status.textContent = 'Saving...';
      // wait a bit so we don't write to storage on every keystroke
      clearTimeout(save_timer);
      save_timer = setTimeout(function () {
        try {
          localStorage.setItem('dasadapple-note', note.value);
          status.textContent = 'Saved on this device ✓';
        } catch (err) {
          status.textContent = 'Browser storage is unavailable';
        }
      }, 220);
    });

    $('[data-clear]', win).onclick = function () {
      if (!confirm('Clear this note?')) return;
      note.value = '';
      note.dispatchEvent(new Event('input'));
    };
  }

  function setupBrowser(win) {
    var address = $('[data-address]', win);

    function visit() {
      var url = address.value.trim();
      if (!url) return;
      if (!/^https?:\/\//i.test(url)) {
        if (url.includes('.')) url = 'https://' + url;
        else url = 'https://www.google.com/' + encodeURIComponent(url);
      }
      window.open(url, '_blank', 'noopener,noreferrer');
    }

    $('[data-browser-form]', win).onsubmit = function (e) {
      e.preventDefault();
      visit();
    };

    $$('[data-site]', win).forEach(function (button) {
      button.onclick = function () {
        address.value = button.dataset.site;
        visit();
      };
    });
  }

  function setupMaps(win) {
    var form = $('[data-maps-form]', win);
    var query = $('[data-maps-query]', win);
    var frame = $('[data-map-frame]', win);

    function mapIt() {
      var place = query.value.trim();
      if (!place) {
        toast('type a place first lol');
        return;
      }
      frame.src = 'https://www.google.com/maps?q=' + encodeURIComponent(place) + '&output=embed';
    }

    form.onsubmit = function (e) {
      e.preventDefault();
      mapIt();
    };

    $('[data-directions]', win).onclick = function () {
      var place = query.value.trim();
      if (!place) {
        toast('where we going tho');
        return;
      }
      window.open('https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(place), '_blank', 'noopener,noreferrer');
    };
  }

  function setupFinder(win) {
    $$('[data-file]', win).forEach(function (file) {
      file.ondblclick = function () { openApp(file.dataset.file); };
    });

    $('[data-folder]', win).onclick = function () {
      var folderName = prompt('What should this folder be called?');
      if (!folderName || !folderName.trim()) return;

      var item = document.createElement('div');
      item.className = 'thing';
      var glyph = document.createElement('div');
      glyph.className = 'mark';
      glyph.textContent = '▱';
      var name = document.createElement('div');
      name.className = 'label';
      name.textContent = folderName.trim();
      item.append(glyph, name);

      // these folders don't save anywhere, they disappear on refresh
      $('[data-files]', win).appendChild(item);
      toast('added a folder idea: ' + folderName);
    };
  }

  function setupSettings(win) {
    $$('[data-color]', win).forEach(function (button) {
      button.onclick = function () {
        var color = button.dataset.color;
        document.documentElement.style.setProperty('--orange', color);
        document.documentElement.style.setProperty('--accent', color);
        document.documentElement.style.setProperty('--orange-pale', color + '55');
        $$('[data-color]', win).forEach(function (chip) {
          if (chip === button) chip.classList.add('picked');
          else chip.classList.remove('picked');
        });
        toast('accent changed');
      };
    });

    $('[data-upload]', win).onclick = function () {
      $('#wallpaper-upload').click();
    };

    $('[data-reset-wallpaper]', win).onclick = function () {
      $('#desktop').style.backgroundImage = '';
      $('#desktop').style.backgroundColor = '#ffffff';
      $('#desktop').style.backgroundSize = 'cover';
      $('#desktop').style.backgroundPosition = 'center';
      toast('background reset');
    };
  }

  // cntrl + k currently under working
  function runDesktopCommand(raw) {
    var command = raw.trim();
    if (!command) return 'type something first';

    var lower = command.toLowerCase();

    var appName = null;
    for (var key in appDetails) {
      var k = key.toLowerCase();
      var t = appDetails[key].title.toLowerCase();
      if (lower === k || lower === t || lower === 'open ' + k || lower === 'open ' + t) {
        appName = key;
        break;
      }
    }
    if (appName) {
      openApp(appName);
      return 'Opened ' + appDetails[appName].title + '.';
    }

    if (lower === 'help' || lower === 'what can you do?' || lower === 'what apps are available?') {
      return 'Try "open notes", "open maps", "open spotify", "open settings", "open about me", or "open terminal". Ctrl/⌘ + K opens this command bar.';
    }
    if (lower.startsWith('search ')) {
      var q = command.slice(7);
      window.open('https://www.google.com/search?q=' + encodeURIComponent(q), '_blank', 'noopener,noreferrer');
      return 'search opened in a new tab';
    }
    if (lower.startsWith('note ')) {
      openApp('Notes');
      return 'Notes is open. Copy this into your notepad: ' + command.slice(5);
    }
    return 'this is just local desktop mode rn. try help or open an app';
  }

  function showWindowMenu(x, y, name, win) {
    var menu = $('#window-context');
    var maximizeText = win.classList.contains('maximized') ? 'Restore size' : 'Maximize';

    menu.innerHTML = `<button data-menu="restore">Bring to front</button><button data-menu="minimize">Minimize</button><button data-menu="maximize">${maximizeText}</button><div class="sep"></div><button data-menu="settings">Desktop settings</button><button class="nope" data-menu="close">Close window</button>`;
    menu.hidden = false;

    var px = Math.min(x, innerWidth - 190);
    if (px < 0) px = 0;
    menu.style.left = px + 'px';

    var py = Math.min(y, innerHeight - 210);
    if (py < 35) py = 35;
    menu.style.top = py + 'px';

    menu.onclick = function (e) {
      var hit = e.target.closest('[data-menu]');
      if (!hit) return;
      var action = hit.dataset.menu;
      menu.hidden = true;

      if (action === 'restore') {
        win.classList.remove('hidden');
        zCounter = zCounter + 1;
        win.style.zIndex = zCounter;
      }
      if (action === 'minimize') win.classList.add('hidden');
      if (action === 'maximize') win.classList.toggle('maximized');
      if (action === 'settings') openApp('Settings');
      if (action === 'close') {
        win.remove();
        windows.delete(name);
        syncDock();
      }
    };
  }

  function openCommandPalette() {
    var host = $('#command-layer');
    host.hidden = false;
    host.className = 'palette-backdrop';
    host.innerHTML = `<div class="command-palette"><form data-palette-form><input data-palette-input placeholder="Open an app or search the web..." autocomplete="off" aria-label="Global command"><button class="btn gobtn">Go ↗</button></form><div class="hint">ENTER to run · ESC to close · Try "open notes" or "search typography"</div></div>`;

    var input = $('[data-palette-input]', host);
    input.focus();

    $('[data-palette-form]', host).onsubmit = function (e) {
      e.preventDefault();
      var value = input.value.trim();
      if (value) toast(runDesktopCommand(value));
      host.hidden = true;
    };

    // clicking the dim part behind it closes the shi
    host.onclick = function (e) {
      if (e.target === host) host.hidden = true;
    };
  }

  $('#gearbtn').onclick = function () { openApp('Settings'); };

  $$('.slot').forEach(function (button) {
    button.onclick = function () { openApp(button.dataset.app); };
  });

  $('#wallpaper-upload').addEventListener('change', function (e) {
    var file = e.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      toast('please pick an image file');
      return;
    }
    var reader = new FileReader();
    reader.onload = function () {
      $('#desktop').style.backgroundImage = 'url("' + reader.result + '")';
      $('#desktop').style.backgroundSize = 'cover';
      $('#desktop').style.backgroundPosition = 'center';
      toast('wallpaper changed!');
    };
    reader.onerror = function () { toast('could not load that image'); };
    reader.readAsDataURL(file);
  });

  document.addEventListener('keydown', function (e) {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      openCommandPalette();
    }
    if ((e.ctrlKey || e.metaKey) && e.code === 'Space') {
      e.preventDefault();
      openApp('Terminal');
    }
    if (e.key === 'Escape') {
      $('#command-layer').hidden = true;
      $('#window-context').hidden = true;
    }
  });

  document.addEventListener('pointerdown', function (e) {
    var menu = $('#window-context');
    if (!menu.contains(e.target)) menu.hidden = true;
  });

  // if the window goes off screen after a resize, pull it back in
  window.addEventListener('resize', function () {
    $$('.window:not(.maximized)').forEach(function (win) {
      var r = win.getBoundingClientRect();
      if (r.right > innerWidth) {
        var x = innerWidth - win.offsetWidth - 10;
        if (x < 0) x = 0;
        win.style.left = x + 'px';
      }
      if (r.bottom > innerHeight - 85) {
        var y = innerHeight - win.offsetHeight - 100;
        if (y < 43) y = 43;
        win.style.top = y + 'px';
      }
    });
  });

})();
</script> 
</body>
</html>
